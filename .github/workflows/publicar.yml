# Publica la carpeta sitio/ en GitHub Pages cada vez que cambia la rama main.
# Antes de publicar corre las pruebas del cálculo (npm test); si alguna falla, no se publica.
#
# Requisito (una sola vez): en GitHub, Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:   # permite publicar a mano desde la pestaña Actions

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pruebas:
    name: Pruebas del cálculo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Solo se necesita node --test; las herramientas de navegador no se instalan aquí
      - run: node --test "pruebas/*.test.js"

  publicar:
    name: Publicar sitio/
    needs: pruebas
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: sitio
      - id: despliegue
        uses: actions/deploy-pages@v5
